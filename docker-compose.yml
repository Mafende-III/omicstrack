services:
  traefik:
    image: traefik:v2.11
    restart: unless-stopped
    command:
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=admin@omicstrack.com
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - web

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: omicstrack
      POSTGRES_USER: omicstrack
      POSTGRES_PASSWORD: 5b46a9bab1e096d9504a5f26d4689e86
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omicstrack"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://omicstrack:5b46a9bab1e096d9504a5f26d4689e86@db:5432/omicstrack
      JWT_SECRET: 0152b09f83cafc6ba4820f590d54c12cb3a0925911e0f96aba7f3bc85a8ba2e7
      JWT_REFRESH_SECRET: 4f07f3b9cc5b86bcc18987cbf7c6bc91bb425ced7b2fcb70dcadda106aa1fa09
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      UPLOAD_DIR: /app/uploads
      PORT: 3001
      NODE_ENV: production
      CORS_ORIGIN: https://omicstrack.com
    volumes:
      - uploads:/app/uploads
    networks:
      - internal

  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile.client
    restart: unless-stopped
    depends_on:
      - server
    labels:
      - traefik.enable=true
      - traefik.docker.network=omicstrack_web
      - traefik.http.routers.omicstrack.rule=Host(`omicstrack.com`) || Host(`www.omicstrack.com`)
      - traefik.http.routers.omicstrack.entrypoints=websecure
      - traefik.http.routers.omicstrack.tls.certresolver=letsencrypt
      - traefik.http.services.omicstrack.loadbalancer.server.port=80
      - traefik.http.routers.omicstrack-http.rule=Host(`omicstrack.com`) || Host(`www.omicstrack.com`)
      - traefik.http.routers.omicstrack-http.entrypoints=web
      - traefik.http.routers.omicstrack-http.middlewares=redirect-to-https
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      - traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true
    networks:
      - web
      - internal

networks:
  web:
    driver: bridge
  internal:
    driver: bridge

volumes:
  pgdata:
  uploads:
  letsencrypt:
