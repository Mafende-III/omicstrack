services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: omicstrack
      POSTGRES_USER: omicstrack
      POSTGRES_PASSWORD: 5b46a9bab1e096d9504a5f26d4689e86
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omicstrack"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://omicstrack:5b46a9bab1e096d9504a5f26d4689e86@db:5432/omicstrack
      JWT_SECRET: 0152b09f83cafc6ba4820f590d54c12cb3a0925911e0f96aba7f3bc85a8ba2e7
      JWT_REFRESH_SECRET: 4f07f3b9cc5b86bcc18987cbf7c6bc91bb425ced7b2fcb70dcadda106aa1fa09
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      UPLOAD_DIR: /app/uploads
      PORT: 3001
      NODE_ENV: production
      CORS_ORIGIN: https://omicstrack.com
    volumes:
      - uploads:/app/uploads

  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile.client
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - server
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot

  certbot:
    image: certbot/certbot
    depends_on:
      - nginx
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'if [ ! -f /etc/letsencrypt/live/omicstrack.com/fullchain.pem ]; then sleep 10 && certbot certonly --webroot -w /var/www/certbot -d omicstrack.com -d www.omicstrack.com --email admin@omicstrack.com --agree-tos --no-eff-email --force-renewal; fi; trap exit TERM; while :; do sleep 12h; certbot renew --quiet; done'"

volumes:
  pgdata:
  uploads:
  certbot-conf:
  certbot-www:
